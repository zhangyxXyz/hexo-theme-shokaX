# Holiday decoration table. Site data/festivals.yml overrides individual fields.
# Windows are inclusive, measured in calendar days in this timezone.
timezone: Asia/Shanghai
# Earlier entries win when display windows overlap. daily is the fallback.
priority: [spring, dragon_boat, mid_autumn]
items:
  daily:
    enable: true
    # Everyday bamboo and crescent; no schedule required.
  spring:
    enable: true
    calendar: lunar
    month: 1
    day: 1
    before: 7
    after: 14 # Through lunar January 15 (Lantern Festival).
    blossom: ''
    word1: ''
    word2: ''
  dragon_boat:
    enable: true
    calendar: lunar
    month: 5
    day: 5
    before: 3
    after: 2
  mid_autumn:
    enable: true
    calendar: lunar
    month: 8
    day: 15
    before: 7
    after: 3
